# ============================================================================
# dsh-chronicle · 起居注 —— bundle patch
# 把本插件的一行插进 profile 的配置树。行名 = 包名。
# Client 半边（右侧栏面板）已在 P4 接入并上线，见 package.json 的 dsh.client 段。
#
# 注意：声明面只用宿主支持的形状 ——
#   工具 output.schema 里 type 必须是**单个字符串**（不支持 ['string','null']），
#   additionalProperties 必须是**布尔**（不支持对象）。
# 违反会让整个条目 `import failed`，DSH 启动失败，并且**插件会被自动从 profile 摘掉**。
# ============================================================================
- insert:
    - id: dsh-chronicle
      name: 'dsh-chronicle'
      config: {}

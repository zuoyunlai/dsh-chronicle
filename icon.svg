<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-chronicle 起居注">
  <title>dsh-chronicle</title>
  <!--
    图形取自用户提供的 起居注.svg（三片竹简：竹色 #B39B77 + 米色书列 #F1E7D4）。

    ## 几何全部按用户参考图实测，不估
    从参考图（1012×1061）逐行扫描底板与竹色的颜色跃变，量出：
      底板边长           603 px
      左右/上下内边距    92 px  = 15.3%      ← 关键：上一版只有 5.4%，竖条撞进圆角
      单条宽             121 px = 20.1%
      条间间隙           24 px  = 4.0%
      条形高             416 px = 69.1%（占底板）
      底板圆角半径       78 px  = 12.9%      ← 上一版 25%，比参考图圆一倍

    换算到 56 单位底板（viewBox 64、内缩 4）：
      内边距 8.57 → 内容区 12.57..51.43
      条宽 11.26、间隙 2.55、条高 38.86
      圆角 7.2

    ## 内部米色沿用原图比例
      书列宽 = 条宽 37.6%，x 偏移 31.2%
      高条：条内 y 9.9%，高 49.0%
      两小条：条内 y 73.8% / 83.4%，各高 5.52%
  -->

  <!-- 底板：#2E3138 比侧栏深色底 #1B1D21 亮一档，否则边缘和背景分不开 -->
  <rect x="4" y="4" width="56" height="56" rx="7.2" fill="#2E3138"/>

  <g>
    <!-- 第 1 片 -->
    <rect x="12.57" y="12.57" width="11.26" height="38.86" rx="0.6" fill="#B39B77"/>
    <rect x="16.08" y="16.42" width="4.23" height="19.04" fill="#F1E7D4"/>
    <rect x="16.08" y="41.25" width="4.23" height="2.15" fill="#F1E7D4"/>
    <rect x="16.08" y="44.98" width="4.23" height="2.15" fill="#F1E7D4"/>

    <!-- 第 2 片 -->
    <rect x="26.37" y="12.57" width="11.26" height="38.86" rx="0.6" fill="#B39B77"/>
    <rect x="29.88" y="16.42" width="4.23" height="19.04" fill="#F1E7D4"/>
    <rect x="29.88" y="41.25" width="4.23" height="2.15" fill="#F1E7D4"/>
    <rect x="29.88" y="44.98" width="4.23" height="2.15" fill="#F1E7D4"/>

    <!-- 第 3 片 -->
    <rect x="40.18" y="12.57" width="11.26" height="38.86" rx="0.6" fill="#B39B77"/>
    <rect x="43.69" y="16.42" width="4.23" height="19.04" fill="#F1E7D4"/>
    <rect x="43.69" y="41.25" width="4.23" height="2.15" fill="#F1E7D4"/>
    <rect x="43.69" y="44.98" width="4.23" height="2.15" fill="#F1E7D4"/>
  </g>
</svg>

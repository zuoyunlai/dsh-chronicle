<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-chronicle 起居注">
  <title>dsh-chronicle</title>
  <!--
    图形取自用户提供的 起居注.svg（三片竹简：竹色 #B39B77 + 米色书列 #F1E7D4）。
    这里只做两处**非破坏性**适配，图形语言未改：

    ① 套上生态约定的内缩圆角底（x=4 y=4 w=56 rx=14）
       —— dsh-theme-palette / dsh-rightbar-quicknav 等已装插件都是这个规格。
       裸图在浅色底上（#B39B77 on #F5F6F8）对比度偏低，且图标边缘没有边界。

    ② 竖片间隙 6.24% → 9.6%（原 30.09/482 单位）
       原间隙在 16px 下只有 1.0px，三片会并成一块。现在是 1.5px，分得开。
       代价：每片从 141.54 收窄到 12.67/64 ≈ 视觉上略瘦，三片节奏不变。

    其余全部按原图比例：书列宽 = 竖片宽的 37.6%，
    小横列位置 = 原图的 73.8% 与 83.4% 处。
  -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#2E3138"/>

  <g>
    <!-- 第 1 片 -->
    <rect x="7" y="6" width="12.67" height="52" rx="1.4" fill="#B39B77"/>
    <rect x="10.78" y="11.1" width="4.76" height="25.5" fill="#F1E7D4"/>
    <rect x="10.78" y="44.4" width="4.76" height="2.9" fill="#F1E7D4"/>
    <rect x="10.78" y="49.4" width="4.76" height="2.9" fill="#F1E7D4"/>

    <!-- 第 2 片 -->
    <rect x="25.67" y="6" width="12.67" height="52" rx="1.4" fill="#B39B77"/>
    <rect x="29.45" y="11.1" width="4.76" height="25.5" fill="#F1E7D4"/>
    <rect x="29.45" y="44.4" width="4.76" height="2.9" fill="#F1E7D4"/>
    <rect x="29.45" y="49.4" width="4.76" height="2.9" fill="#F1E7D4"/>

    <!-- 第 3 片 -->
    <rect x="44.33" y="6" width="12.67" height="52" rx="1.4" fill="#B39B77"/>
    <rect x="48.11" y="11.1" width="4.76" height="25.5" fill="#F1E7D4"/>
    <rect x="48.11" y="44.4" width="4.76" height="2.9" fill="#F1E7D4"/>
    <rect x="48.11" y="49.4" width="4.76" height="2.9" fill="#F1E7D4"/>
  </g>
</svg>
